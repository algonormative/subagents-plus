name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Tag matches plugin.json version
        run: |
          want="v$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $want" >&2
            exit 1
          fi
      - name: Validate and test
        run: |
          claude plugin validate .
          claude plugin test .
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v"$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
      - name: Package
        run: git archive --format=zip --prefix="subagents-plus/" -o "subagents-plus-${GITHUB_REF_NAME}.zip" HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "subagents-plus-${GITHUB_REF_NAME}.zip" --title "subagents-plus $GITHUB_REF_NAME" --notes-file notes.md
